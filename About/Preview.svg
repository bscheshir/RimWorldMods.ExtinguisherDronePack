		<text x="4" y="80" fill="#000000" fill-opacity="0.55" font-family="'RimWordFont', 'Bahnschrift', 'Impact', sans-serif" font-size="76" letter-spacing="3">EXTINGUISHER</text>
		<text x="0" y="76" fill="#ffffff" font-family="'RimWordFont', 'Bahnschrift', 'Impact', sans-serif" font-size="76" letter-spacing="3">EXTINGUISHER</text>

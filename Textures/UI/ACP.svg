<svg xmlns="http://w3.org" viewBox="0 0 128 128" width="128" height="128">
	<g>
		<!-- Узкий красный баллон (центр по X = 46, ширина = 46) -->
		<path d="M 23,122 L 23,88 C 23,70 32,60 46,60 C 60,60 69,70 69,88 L 69,122 Z"
			  fill="#de3c39" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
		<!-- Тень на правом боку баллона (#ad1c21) -->
		<path d="M 49,62 C 59,64 66,74 66,88 L 66,119 L 54,119 L 54,88 C 54,76 52,67 49,62 Z"
			  fill="#ad1c21"/>
		<!-- Блик слева на баллоне -->
		<path d="M 31,114 L 31,89 C 31,78 35,72 41,69"
			  fill="none" stroke="#ff8a80" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

		<!-- Длинные рукоятки СЛЕВА (выглядывают из-за крупного манометра) -->
		<!-- Нижняя ручка -->
		<path d="M 36,52 L 4,56 L 6,64 L 36,59 Z"
			  fill="#70757a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
		<!-- Верхний нажимной рычаг -->
		<path d="M 36,44 L 3,26 L -1,34 L 36,50 Z"
			  fill="#d6dade" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

		<!-- Короткая трубка от клапана вправо к воронке -->
		<path d="M 56,50 L 76,50 C 83,50 87,54 87,61 L 87,66"
			  fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
		<path d="M 56,50 L 76,50 C 83,50 87,54 87,61 L 87,66"
			  fill="none" stroke="#5a6066" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

		<!-- Крупная длинная воронка ПОВЕРХ правого края баллона -->
		<polygon points="79,65 95,65 106,120 65,120"
				 fill="#2b2e33" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>

		<!-- Крупный манометр строго по центру баллона (cx = 46, cy = 50, r = 24) -->
		<circle cx="46" cy="50" r="24" fill="#ffffff" stroke="#000000" stroke-width="5"/>
		<!-- Внутренний ободок шкалы -->
		<circle cx="46" cy="50" r="18.5" fill="none" stroke="#d0d4d9" stroke-width="2"/>

		<!-- Крупные цветные сектора шкалы как на фото: КРАСНЫЙ -> ЗЕЛЁНЫЙ -> ЖЁЛТЫЙ -->
		<!-- Красный сектор (слева) -->
		<path d="M 31.5,58.5 A 16.5,16.5 0 0,1 36,36.5"
			  fill="none" stroke="#de3c39" stroke-width="5.5"/>
		<!-- Зелёный сектор (по центру, допустимое давление) -->
		<path d="M 36,36.5 A 16.5,16.5 0 0,1 56,36.5"
			  fill="none" stroke="#46b849" stroke-width="6"/>
		<!-- Жёлтый сектор (справа) -->
		<path d="M 56,36.5 A 16.5,16.5 0 0,1 60.5,58.5"
			  fill="none" stroke="#f2c94c" stroke-width="5.5"/>

		<!-- Деления шкалы -->
		<line x1="30.5" y1="54" x2="34.5" y2="52" stroke="#000000" stroke-width="2"/>
		<line x1="46" y1="32" x2="46" y2="36.5" stroke="#000000" stroke-width="2"/>
		<line x1="61.5" y1="54" x2="57.5" y2="52" stroke="#000000" stroke-width="2"/>

		<!-- Жирная стрелка манометра строго вверх в зелёный сектор -->
		<line x1="46" y1="53" x2="46" y2="34.5" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
		<circle cx="46" cy="53" r="4.2" fill="#181818"/>
	</g>

	<!-- Две голубые стрелки цикла в правом верхнем углу -->
	<g transform="translate(95, 25) rotate(-12)">
		<path d="M 23,-6
             A 24,24 0 0,0 -18,-15
             L -24,-19
             L -19,-3
             L -5,-9
             L -11,-12
             A 14,14 0 0,1 13,-3
             Z"
			  fill="#68c3ee" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

		<path d="M -23,6
             A 24,24 0 0,0 18,15
             L 24,19
             L 19,3
             L 5,9
             L 11,12
             A 14,14 0 0,1 -13,3
             Z"
			  fill="#68c3ee" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
	</g>
</svg>
